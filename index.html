<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTracker Web</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4E7E5A">
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- iPhone PWA Optimization -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GreenTracker">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0F1410;
        }
        #compose-app {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- JSZip for Pro Backups -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        function triggerZipExport(filename, jsonData, imagesJson) {
            const zip = new JSZip();
            zip.file("backup_data.json", jsonData);

            try {
                const images = JSON.parse(imagesJson);
                const imgFolder = zip.folder("images");
                for (const [key, base64Data] of Object.entries(images)) {
                    if (base64Data) {
                        const cleanBase64 = base64Data.includes(",") ? base64Data.split(",")[1] : base64Data;
                        imgFolder.file(key + ".png", cleanBase64, {base64: true});
                    }
                }
            } catch(e) {}

            zip.generateAsync({type:"blob"}).then(function(content) {
                const url = URL.createObjectURL(content);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = filename;
                anchor.click();
                URL.revokeObjectURL(url);
            });
        }

        function triggerZipImport(onSuccess) {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".zip";
            input.onchange = () => {
                const file = input.files[0];
                if (file) {
                    JSZip.loadAsync(file).then(async (zip) => {
                        const jsonFile = zip.file("backup_data.json");
                        if (!jsonFile) {
                            onSuccess("", "");
                            return;
                        }
                        const jsonText = await jsonFile.async("string");

                        const imagesMap = {};
                        const imgFolder = zip.folder("images");
                        if (imgFolder) {
                            const entries = [];
                            imgFolder.forEach((relativePath, zipEntry) => {
                                if (!zipEntry.isDirectory) {
                                    entries.push({name: relativePath, entry: zipEntry});
                                }
                            });
                            for (const f of entries) {
                                const base64 = await f.entry.async("base64");
                                imagesMap[f.name] = "data:image/png;base64," + base64;
                            }
                        }
                        onSuccess(jsonText, JSON.stringify(imagesMap));
                    }).catch(() => onSuccess("", ""));
                }
            };
            input.click();
        }
    </script>
</head>
<body>
    <div id="compose-app"></div>
    <script src="skiko.js"></script>
    <script src="composeApp.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('SW failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
